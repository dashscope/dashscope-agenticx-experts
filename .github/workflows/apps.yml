name: App Catalog

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install pre-commit==4.3.0
      - run: pre-commit run --all-files --show-diff-on-failure

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install AgenticX Runtime
        run: pip install "dashscope-agenticx>=1.0.0,<2" pytest
      - name: Run catalog unit tests
        run: pytest -q tests/test_apps.py
