# AgenticX custom extensions — dashscope-sdk-expert Expert
# ============================================================================
# Declares the tongyi provider for the SDK Expert. After copying this Expert,
# add more providers or capabilities as needed. See
# apps/basic-chat/.agenticx/custom-extensions.toml for detailed field
# documentation.
# ============================================================================

[[providers]]
name = "tongyi"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
default_model = "qwen3.8-flash"
models = [
    "qwen3.8-flash",
    "qwen3.8-max",
    "qwen3.7-max",
    "qwen3.7-plus",
    "qwen3-vl-flash",
    "qwen3-vl-plus",
]
vision_models = ["qwen3-vl-flash", "qwen3-vl-plus"]
protocol = "openai"
